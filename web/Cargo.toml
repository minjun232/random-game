[package]
name = "random-game-web"
version = "2.0.0"
edition = "2021"

[dependencies]
leptos = { version = "0.6.15", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "CssStyleDeclaration",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "CanvasRenderingContext2d",
    "TextMetrics",
    "KeyboardEvent",
    "MouseEvent",
    "EventTarget",
    "Navigator",
    "Performance",
    "AudioContext",
    "AudioContextState",
    "BaseAudioContext",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioScheduledSourceNode",
    "AudioNode",
    "AudioDestinationNode",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
